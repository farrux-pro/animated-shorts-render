name: stills
on:
  workflow_dispatch:
    inputs:
      comp: {description: "Композиция", default: "GtaShort"}
      frames: {description: "Кадры через запятую", default: "20,110,150,215,250,290"}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: {list: "${{ steps.p.outputs.list }}"}
    steps:
      - id: p
        run: echo "list=$(python3 -c "import json;print(json.dumps('${{ inputs.frames }}'.split(',')))")" >> "$GITHUB_OUTPUT"
  still:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {f: "${{ fromJSON(needs.plan.outputs.list) }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: sudo apt-get update && sudo apt-get install -y libnss3 libgbm1 libasound2t64 libxkbcommon0 libatk-bridge2.0-0 libcups2 libxcomposite1 libxdamage1 libxrandr2 libpango-1.0-0 libcairo2
      - run: npm ci
      - run: npx remotion browser ensure
      - run: mkdir -p out && npx remotion still src/index.ts ${{ inputs.comp }} out/f$(printf %04d ${{ matrix.f }}).png --frame=${{ matrix.f }} --scale=0.5 --gl=swangle --timeout=900000
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "still-${{ matrix.f }}", path: out/}
