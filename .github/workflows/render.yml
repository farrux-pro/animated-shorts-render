name: render
on:
  workflow_dispatch:
    inputs:
      comp: {description: "Композиция", default: "GtaShort"}
      start: {description: "Первый кадр (30 = 1 секунда)", default: "0"}
      frames: {description: "Сколько кадров рендерить", default: "312"}
      chunk: {description: "Кадров на один сервер", default: "8"}
      scale: {description: "Масштаб (0.6667 = 720x1280, 1 = 1080x1920)", default: "0.6667"}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      parts: ${{ steps.p.outputs.parts }}
    steps:
      - id: p
        run: |
          s=${{ inputs.start }}; n=${{ inputs.frames }}; c=${{ inputs.chunk }}
          parts=$(python3 -c "import json;s,n,c=$s,$n,$c;print(json.dumps([f'{a}-{min(a+c,s+n)-1}' for a in range(s,s+n,c)]))")
          echo "parts=$parts" >> "$GITHUB_OUTPUT"; echo "$parts"

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: sudo apt-get update && sudo apt-get install -y libnss3 libgbm1 libasound2t64 libxkbcommon0 libatk-bridge2.0-0 libcups2 libxcomposite1 libxdamage1 libxrandr2 libpango-1.0-0 libcairo2
      - run: npm ci
      - run: npx remotion browser ensure
      - run: |
          echo "cores: $(nproc)"
          npx remotion render src/index.ts ${{ inputs.comp }} out/part.mp4 --frames=${{ matrix.part }} \
            --scale=${{ inputs.scale }} --gl=swangle --timeout=900000 --codec=h264 --crf=18 \
            --concurrency=$(nproc) --muted
          mkdir -p parts && start=$(echo "${{ matrix.part }}" | cut -d- -f1)
          mv out/part.mp4 parts/$(printf %06d $start).mp4
      - uses: actions/upload-artifact@v4
        with: {name: "part-${{ matrix.part }}", path: parts/}

  join:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: "part-*", merge-multiple: true, path: parts}
      - run: |
          sudo apt-get install -y ffmpeg >/dev/null
          ls parts | sort | sed "s|^|file 'parts/|; s|$|'|" > list.txt
          mkdir -p out && ffmpeg -y -f concat -safe 0 -i list.txt -c copy -movflags +faststart out/video.mp4
      - uses: actions/upload-artifact@v4
        with: {name: render, path: out/video.mp4}
